name: Console CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-friends-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/log-freind/log-friends-console
  K8S_NAMESPACE: log-friends
  K8S_DEPLOYMENT: log-friends-console
  K8S_CONTAINER: console
  HEALTH_URL: http://127.0.0.1/actuator/health

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    name: Build image and deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runner tools
        run: |
          docker version
          microk8s status --wait-ready

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy commit image
        run: |
          microk8s kubectl set image \
            deployment/${K8S_DEPLOYMENT} \
            ${K8S_CONTAINER}=${IMAGE_NAME}:${GITHUB_SHA} \
            -n ${K8S_NAMESPACE}
          microk8s kubectl rollout status \
            deployment/${K8S_DEPLOYMENT} \
            -n ${K8S_NAMESPACE} \
            --timeout=180s

      - name: Health check
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused "${HEALTH_URL}"
